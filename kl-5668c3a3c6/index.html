*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(180deg,var(--kl-bg-1) 0%,var(--kl-bg-2) 50%,var(--kl-bg-3) 100%);color:var(--kl-on-bg);font-family:var(--kl-font);display:flex;justify-content:center}

#board,.sq,.tp,.tile,button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.screen{width:100%;max-width:var(--kl-max);height:100%;padding:var(--kl-space-3) var(--kl-space-3);display:none;flex-direction:column;align-items:center;gap:var(--kl-space-2);overflow-y:auto}

header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:var(--kl-space-2);min-height:var(--kl-tap);padding-top:env(safe-area-inset-top);flex:none}
header h1{margin:0;font-size:var(--kl-fs-header);font-weight:800;flex:1;text-align:center}
.ghost{background:var(--kl-ghost);color:var(--kl-on-bg);border:0;border-radius:var(--kl-radius-pill);min-height:var(--kl-tap);padding:var(--kl-space-2) var(--kl-space-4);font-size:var(--kl-fs-ghost);font-weight:600;cursor:pointer}
.ghost.round{width:var(--kl-tap);min-width:var(--kl-tap);height:var(--kl-tap);padding:0;font-size:var(--kl-fs-ghost-round);font-weight:800}
.card{background:var(--kl-card);color:var(--kl-ink);border-radius:var(--kl-radius-lg);box-shadow:var(--kl-shadow);width:100%}
.info{padding:var(--kl-space-2) var(--kl-space-4)}
.info h2{margin:0 0 2px;font-size:var(--kl-fs-h2)}
.info p{margin:0;font-size:var(--kl-fs-body);color:var(--kl-ink-soft)}
.pc{color:var(--kl-piece);line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pc svg,.ico-svg{width:1em;height:1em;display:block;fill:currentColor}
.pc svg .cut{fill:var(--kl-card);stroke:var(--kl-card)}
#heroG .pc svg .cut,#doneG .pc svg .cut{fill:var(--kl-bg-2);stroke:var(--kl-bg-2)}
.sq.clue{flex-direction:column;gap:.08em}
.sq.clue .num{line-height:1;margin-bottom:.32em}
.cd{display:flex;gap:var(--kl-dot-gap);justify-content:center;flex-wrap:wrap;line-height:0;position:absolute;left:8%;right:8%;bottom:7%}
.cd i{width:max(var(--kl-dot-min),var(--kl-dot-clue));height:max(var(--kl-dot-min),var(--kl-dot-clue));border-radius:var(--kl-radius-pill);box-sizing:border-box;border:max(1.5px,.045em) solid currentColor;display:block}
.cd i.f{background:currentColor}
.cd i.x{background:var(--kl-error);border-color:var(--kl-error)}
.cd .cdt{font-size:max(11px,.42em);line-height:1;font-weight:800;letter-spacing:.02em}
.cd .cdt.x{color:var(--kl-error)}
#dbgTag{position:fixed;top:2px;left:2px;z-index:9;font:700 9px/1 var(--kl-font);letter-spacing:.06em;padding:2px 4px;border-radius:3px;background:var(--kl-error);color:var(--kl-accent-ink);opacity:.9;pointer-events:none}
:focus:not(:focus-visible){outline:none}
:focus-visible{outline:3px solid var(--kl-hint-ring);outline-offset:3px}
#board{display:grid;gap:var(--kl-board-gap);padding:var(--kl-space-1);width:min(100%,46vh);flex:none}
.sq{aspect-ratio:1;border:0;border-radius:var(--kl-radius-sm);color:var(--kl-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;background:var(--kl-cell-light);min-width:0;position:relative}
.sq.dark{background:var(--kl-cell-dark)}
.sq.clue{background:var(--kl-clue);box-shadow:inset 0 0 0 2.5px var(--kl-clue-border);font-weight:800;cursor:default}
.sq.clue.dark{background:var(--kl-clue-dark)}
.sq.clue.ok{box-shadow:inset 0 0 0 4px var(--kl-ok);color:var(--kl-ok);background:var(--kl-ok-bg)}            /* met: thick solid ring */
.sq.clue.over{box-shadow:inset 0 0 0 2.5px var(--kl-error);color:var(--kl-error);background:var(--kl-error-bg);outline:2.5px dashed var(--kl-error);outline-offset:-7px} /* over: dashed inner ring */
.sq.hit{background:var(--kl-attack);box-shadow:inset 0 0 0 3px var(--kl-error)}
.sq.hit .pc{color:var(--kl-error)}
.sq.att:not(.clue):not(.pv)::after{content:"";position:absolute;width:18%;height:18%;border-radius:var(--kl-radius-pill);background:var(--kl-att-dot)}
.sq.pv:not(.clue)::after{content:"";position:absolute;width:34%;height:34%;border-radius:var(--kl-radius-pill);border:2.5px solid var(--kl-preview);box-sizing:border-box}
.sq.clue.pv::before{content:"";position:absolute;top:8%;right:8%;width:20%;height:20%;border-radius:var(--kl-radius-pill);background:var(--kl-preview)}
.sq.pvsrc .ghostpc{opacity:.45;color:var(--kl-preview);pointer-events:none}
.sq .pc{pointer-events:none}
.sq.clash:not(.clue){background-image:linear-gradient(var(--kl-clash),var(--kl-clash))}
.sq.clash:not(.clue)::before{content:"";position:absolute;left:4%;right:4%;top:calc(50% - 1.5px);height:3px;border-radius:2px;background:var(--kl-error)}
.sq.clash.cv::before{transform:rotate(90deg)}.sq.clash.cd1::before{left:-12%;right:-12%;transform:rotate(45deg)}.sq.clash.cd2::before{left:-12%;right:-12%;transform:rotate(-45deg)}

.sq.locked .pc{color:var(--kl-piece-locked)}
.sq.flash{animation:flash .9s ease-out 1}

.tp{width:var(--kl-tap);height:var(--kl-tap);border-radius:var(--kl-radius);border:0;background:var(--kl-card);font-size:var(--kl-fs-tray);cursor:pointer;box-shadow:var(--kl-shadow-sm);padding:0;display:flex;align-items:center;justify-content:center}

.secondary{background:var(--kl-card);color:var(--kl-ink);border:0;border-radius:var(--kl-radius-pill);min-height:var(--kl-tap);padding:var(--kl-space-3) var(--kl-space-5);font-size:var(--kl-fs-secondary);font-weight:700;cursor:pointer;box-shadow:var(--kl-shadow-sm);display:inline-flex;align-items:center;justify-content:center;gap:var(--kl-space-2)}

.hidden{display:none!important}
.hero{text-align:center;margin-top:var(--kl-space-1)}

.foot{margin:0;font-size:var(--kl-fs-foot);opacity:.85;text-align:center}
.hdr-spacer{width:var(--kl-tap);flex:none}

#intro .card{padding:var(--kl-space-5) var(--kl-space-4);text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--kl-space-3)}
#intro h2{margin:0;font-size:var(--kl-fs-intro-h)}

.mini .sq{font-size:var(--kl-fs-mini-sq);cursor:default}
.dots{display:flex;gap:var(--kl-space-2)}

.sq.point{box-shadow:inset 0 0 0 4px var(--kl-preview);animation:klpoint 1.2s ease-in-out 3}

  if(ev.solved&&window.KLWin){const wo={origin:focusKey,sub:"Level "+(cur+1)+" \u00B7 "+lv.title,nextLabel:cur===LEVELS.length-1?"Finish":"Next",onNext:()=>$("next").click(),after:$("status")};
    if(winFor!==lv.id){winFor=lv.id;KLWin.play(b,wo);}else KLWin.settle(b,wo);}
  if(ev.solved&&!solvedSet.has(lv.id)){solvedSet.add(lv.id);prog.solved=[...solvedSet];}
  persistBoard(lv,ev);save();
  const st=$("status");st.className=ev.solved?"win":"";
  if(ev.solved)st.innerHTML="Solved! "+ICO.spark;
  else st.textContent=note?note:ev.hit.size?clashText(pieceType(lv)):
    tray.length?(sel!==null?"Now tap a square for this "+nm+".":"Tap a square to place a "+nm+". Tap a "+nm+" again to take it back."):"All placed: check the numbers.";
  $("next").classList.toggle("hidden",!ev.solved);$("hint").classList.toggle("hidden",ev.solved);$("hintLabel").textContent=hintLabel();
  $("next").textContent=cur===LEVELS.length-1?"Finish":"Next";
  if(hoverKey&&!placed[hoverKey])setPreview(hoverKey,true);else hoverKey=null;}
function hint(){const lv=LEVELS[cur];if(evaluate(lv,placed).solved)return;const kind=hintKind(cur,hs);
  // Rewarded placeholder: always player-started Yes/No, never auto-plays. The real build plays kl_rewarded_hint / kl_rewarded_reveal2 on Yes.
  if(kind==="ad"){const n=adReveal(lv);askConfirm("An ad would play here. Watch it to "+(n>1?"reveal 2 pieces?":"get a hint?"),"Yes",()=>grantHint("ad"),"No",{ad:true});}
  else grantHint(kind);}
function placeHints(lv,n){let mv=null,removed=0,got=0;for(let h=0;h<n;h++){if(evaluate(lv,placed).solved)break;const m=applyHint(lv,placed,tray,locked);if(!m)break;mv=m;got++;removed+=m.removed.length;}return{mv,got,removed};}
function grantHint(kind){const lv=LEVELS[cur];if(evaluate(lv,placed).solved)return;const nm=PIECE_NAME[pieceType(lv)];
  if(kind==="pointer"){const f=hintFocusOf(lv);hs={...hs,free:(hs.free||0)+1,point:true};note="Look here: "+f.line;}
  else{const r=placeHints(lv,kind==="ad"?adReveal(lv):1);if(!r.got)return;sel=null;flashKey=r.mv.k;focusKey=r.mv.k;
    if(kind==="ad"){hs={...hs,ad:(hs.ad||0)+1};prog.adHints=(prog.adHints||0)+1;}else hs={...hs,free:(hs.free||0)+1};
    note=(r.got>1?"Hint: these "+r.got+" "+nm+"s are right, so they stay put.":"Hint: this "+nm+" is right, so it stays put.")+(r.removed?" Took back "+r.removed+" clashing "+nm+(r.removed>1?"s":"")+".":"");}
  hoverKey=null;prog.hints=(prog.hints||0)+1;prog.hintsByLevel=prog.hintsByLevel||{};prog.hintsByLevel[lv.id]=(prog.hintsByLevel[lv.id]||0)+1;render();}
function applyDebugHints(k){for(let h=k;h>0;h--){const lv=LEVELS[cur];if(evaluate(lv,placed).solved)break;const mv=applyHint(lv,placed,tray,locked);if(!mv)break;sel=null;flashKey=mv.k;
  note="Hint: this "+PIECE_NAME[pieceType(lv)]+" is right, so it stays put."+(mv.removed.length?" Took back "+mv.removed.length+" clashing piece"+(mv.removed.length>1?"s":"")+".":"");}render();}
$("hint").onclick=hint; // REWARDED-AD SPOT: the "ad" branch of hint(); no interstitials anywhere in the prototype.
function showDone(){$("donehints").textContent=prog.hints?"Hints used: "+prog.hints+".":"No hints used!";show("done");}
$("next").onclick=()=>cur+1<LEVELS.length?start(cur+1):showDone();
// Restart clears the pieces but keeps this level's hint state (a Restart never refills free hints)
function doRestart(){const lv=LEVELS[cur];locked=new Set();if(boardFor(prog,lv.id)){setBoard(prog,lv.id,hs.free||hs.ad?{placed:{},locked:[],tray:freshTray(lv),hs}:null);save();}start(cur);}
$("restart").onclick=()=>{if(Object.keys(placed).length&&!evaluate(LEVELS[cur],placed).solved)askConfirm("Clear the board and start this level again?","Restart",doRestart);else doRestart();};
// '‹ Levels' never loses work: every level's board in progress is saved (prog.boards[id]) and comes back when you reopen it.
$("tPlay").onclick=()=>{if(!prog.introSeen)openIntro("play");else playNext();};$("tLevels").onclick=showSelect;
$("back").onclick=showSelect;$("toSelect").onclick=showSelect;$("play").onclick=playNext;
// debug/review params are read only when KL_DEBUG is true (see readDebugParams). Debug setup never calls save() or counts hints.
suppressSave=true;
if(dbg.screen==="title")showTitle();else if(dbg.screen==="intro")openIntro("select");else if(dbg.screen==="done")showDone();else if(dbg.screen==="select")showSelect();
else if(dbg.level>=1&&dbg.level<=LEVELS.length&&unlocked(dbg.level-1)){start(dbg.level-1,dbg.state);if(dbg.hint)applyDebugHints(dbg.hint);}
else showTitle(); // title first; Play opens the intro the first time, then the next unsolved level
suppressSave=false;
addEventListener("resize",()=>{if($("game").classList.contains("on"))render();});
addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;save();if($("select").classList.contains("on"))showSelect();});}
</script></body></html>
