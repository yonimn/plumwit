<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="120" height="170" class="kl-lantern" role="img" aria-label="Lantern">
<!-- Knight Lights title lantern (Artist, Nov 20 2026). Original artwork. No text inside: the game name is live HTML (GAME_TITLE). -->
<defs>
 <linearGradient id="klBrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C47A"/><stop offset=".5" stop-color="#C98A3E"/><stop offset="1" stop-color="#8A5422"/></linearGradient>
 <linearGradient id="klBrassH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A5422"/><stop offset=".35" stop-color="#F2C47A"/><stop offset=".6" stop-color="#C98A3E"/><stop offset="1" stop-color="#7A4A1C"/></linearGradient>
 <radialGradient id="klGlass" cx="50%" cy="58%" r="62%"><stop offset="0" stop-color="#FFF6D8"/><stop offset=".45" stop-color="#FFD27A"/><stop offset="1" stop-color="#D9822C"/></radialGradient>
 <radialGradient id="klFlame" cx="50%" cy="70%" r="60%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#FFE7A0"/><stop offset="1" stop-color="#FF9A2E"/></radialGradient>
</defs>
<g stroke="#3A2416" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
 <!-- ring handle -->
 <circle cx="60" cy="12" r="8.5" fill="none" stroke="url(#klBrassH)" stroke-width="5"/>
 <circle cx="60" cy="12" r="11" fill="none" stroke-width="1.6"/>
 <circle cx="60" cy="12" r="6" fill="none" stroke-width="1.6"/>
 <path d="M54 22 H66 V30 H54 Z" fill="url(#klBrass)"/>
 <!-- cap (roof) with finial ridge -->
 <path d="M20 50 C26 40 34 33 42 30 H78 C86 33 94 40 100 50 Z" fill="url(#klBrass)"/>
 <path d="M36 44 H84" fill="none" stroke-width="2" stroke="#8A5422"/>
 <rect x="16" y="49" width="88" height="9" rx="3" fill="url(#klBrassH)"/>
 <!-- glass body -->
 <rect x="24" y="58" width="72" height="76" fill="url(#klGlass)"/>
</g>
<!-- candle + flame (inside the glass) -->
<g class="kl-flame-wrap">
 <ellipse cx="60" cy="96" rx="26" ry="30" fill="#FFF3C8" opacity=".55"/>
 <path class="kl-flame" d="M60 74 C68.5 86 72.5 95 68.5 105 C66.5 110 63.4 112.6 60 112.6 C56.6 112.6 53.5 110 51.5 105 C47.5 95 51.5 86 60 74 Z" fill="url(#klFlame)" stroke="#E07A1E" stroke-width="1.6"/>
 <path d="M60 90 C63.5 96 64.5 101 62.6 105.5 C61.8 107.4 60.9 108.2 60 108.2 C59.1 108.2 58.2 107.4 57.4 105.5 C55.5 101 56.5 96 60 90 Z" fill="#FFFFFF"/>
 <rect x="54.5" y="112" width="11" height="22" rx="2" fill="#FFF5E2" stroke="#3A2416" stroke-width="2.4"/>
</g>
<g stroke="#3A2416" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
 <!-- glass reflections -->
 <path d="M30 66 L38 64 L31 104 Z" fill="#FFFFFF" opacity=".28" stroke="none"/>
 <path d="M77 68 L83 67 L79 88 Z" fill="#FFFFFF" opacity=".22" stroke="none"/>
 <!-- frame posts + mullions -->
 <rect x="21" y="58" width="7" height="76" fill="url(#klBrassH)"/>
 <rect x="92" y="58" width="7" height="76" fill="url(#klBrassH)"/>
 <rect x="46" y="58" width="3.6" height="76" fill="url(#klBrass)" stroke-width="2"/>
 <rect x="70.4" y="58" width="3.6" height="76" fill="url(#klBrass)" stroke-width="2"/>
 <path d="M28 96 H46 M74 96 H92" stroke="url(#klBrass)" stroke-width="3.4"/>
 <path d="M28 96 H46 M74 96 H92" stroke-width="1" fill="none"/>
 <!-- base -->
 <rect x="16" y="133" width="88" height="9" rx="3" fill="url(#klBrassH)"/>
 <path d="M24 142 H96 L89 154 H31 Z" fill="url(#klBrass)"/>
 <path d="M30 154 V160 H40 V154 M80 154 V160 H90 V154" fill="url(#klBrass)"/>
</g>
</svg>
